name: Monthly metrics export

on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the report back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save firebase-admin
      - run: node scripts/export.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      - name: Commit report
        run: |
          git config user.name "flint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git commit -m "Monthly metrics export" || echo "nothing to commit"
          git push